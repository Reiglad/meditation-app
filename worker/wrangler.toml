name = "meditation-app-worker"
main = "src/index.js"
compatibility_date = "2026-08-15"

[triggers]
# 1分間隔でリマインダーをチェックする（Cloudflare Free プランで許可される最小間隔）
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "REMINDERS_KV"
id = "d7fe32fd585c41caadb43b44b5b8f2d1"

[vars]
# VAPID公開鍵は秘密ではないため平文で管理する。
# 秘密鍵・件名・簡易保護トークンは `wrangler secret put` で別途登録する
# （VAPID_PRIVATE_KEY / VAPID_SUBJECT / APP_SECRET）。
VAPID_PUBLIC_KEY = "BAYybnW9rDqTok0_IAmfxIRhSZy_76QbSNGfnA4JEnB6GrfXoh9uyl5HKliYdzzQIgfs80aqdLvp2fH2U8web-0"
