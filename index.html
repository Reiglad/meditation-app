<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>瞑想記録</title>
<meta name="description" content="瞑想とNSDRを記録する個人用PWA" />

<!-- PWA関連 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16211c" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="瞑想記録" />

<!-- Upmind (https://upmind.co.jp/) と同じ書体（本文: Noto Sans JP／見出し: Wix Madefor Display） -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Wix+Madefor+Display:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="bg-layer" class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="app">
  <!-- ホーム画面 -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <div class="greeting-row">
        <div class="greeting-text">
          <span class="hello">こんにちは</span>
          <h1>瞑想記録</h1>
        </div>
        <div class="header-icon" aria-hidden="true">🌿</div>
      </div>
      <div class="streak-badge">
        <span aria-hidden="true">🔥</span>
        <span id="home-streak-text">連続日数 0日</span>
      </div>
    </header>
    <p id="offline-notice-home" class="notice" hidden>
      現在オフラインです。BGM/ナレーションの再生にはインターネット接続が必要ですが、タイマーと記録の閲覧はオフラインでも利用できます。
    </p>
    <div id="quote-card" class="quote-card">
      <p id="quote-text" class="quote-text"></p>
    </div>
    <div class="home-actions">
      <button id="btn-go-meditation" class="big-button primary" type="button">
        <span class="icon" aria-hidden="true">🌙</span>
        <span class="label-group">
          <span class="title">瞑想を始める</span>
          <span class="sub">BGMを聴きながら瞑想タイマーを実施</span>
        </span>
      </button>
      <button id="btn-go-nsdr" class="big-button" type="button">
        <span class="icon" aria-hidden="true">🌊</span>
        <span class="label-group">
          <span class="title">NSDRを始める</span>
          <span class="sub">誘導ナレーションを聴きながら実施</span>
        </span>
      </button>
      <button id="btn-go-history" class="big-button" type="button">
        <span class="icon" aria-hidden="true">📊</span>
        <span class="label-group">
          <span class="title">記録を見る</span>
          <span class="sub">履歴・連続日数・週間/月間の合計</span>
        </span>
      </button>
    </div>
  </section>

  <!-- 瞑想画面 -->
  <section id="screen-meditation" class="screen" hidden>
    <button class="back-link" data-target="home" type="button">← ホームに戻る</button>
    <p class="session-title">瞑想</p>
    <p id="offline-notice-meditation" class="notice warning" hidden>
      オフラインのため動画・BGMを再生できません。タイマーのみ利用できます。
    </p>

    <!-- 実施方法の切り替え：動画に合わせて行うか、タイマーで自分の時間を設定するか -->
    <div class="mode-toggle" role="tablist">
      <button id="btn-meditation-mode-video" class="mode-toggle-btn" type="button" role="tab" aria-selected="true">🎬 動画</button>
      <button id="btn-meditation-mode-timer" class="mode-toggle-btn" type="button" role="tab" aria-selected="false">⏱️ タイマー</button>
    </div>

    <!-- 動画モード：動画の再生に合わせて実施。動画終了と同時に自動終了・記録 -->
    <div id="meditation-mode-video">
      <div class="player-wrap">
        <div id="yt-player-meditation"></div>
      </div>
    </div>

    <!-- タイマーモード：時間を選んでBGM（音声）を聴きながら実施。時間経過で自動終了・記録 -->
    <div id="meditation-mode-timer" hidden>
      <div class="duration-picker">
        <button class="duration-btn" data-min="5" type="button">5分</button>
        <button class="duration-btn" data-min="10" type="button">10分</button>
        <button class="duration-btn" data-min="15" type="button">15分</button>
        <button class="duration-btn" data-min="20" type="button">20分</button>
        <button class="duration-btn" data-min="30" type="button">30分</button>
      </div>
      <div class="bgm-indicator" id="timer-bgm-indicator" hidden>
        <span aria-hidden="true">🎵</span>
        <span>BGMを再生中（チベタンシンギングボウル）</span>
      </div>
      <div class="player-wrap timer-bgm-player">
        <div id="yt-player-meditation-timer"></div>
      </div>
    </div>

    <div id="meditation-timer-display" class="timer-display">00:00</div>
    <div class="session-controls">
      <button id="btn-meditation-start" class="btn primary" type="button">開始</button>
      <button id="btn-meditation-stop" class="btn danger" type="button" disabled>終了して記録</button>
    </div>
  </section>

  <!-- NSDR画面 -->
  <section id="screen-nsdr" class="screen" hidden>
    <button class="back-link" data-target="home" type="button">← ホームに戻る</button>
    <p class="session-title">NSDR</p>
    <p id="offline-notice-nsdr" class="notice warning" hidden>
      オフラインのためナレーションを再生できません。タイマーのみ利用できます。
    </p>
    <div class="player-wrap">
      <div id="yt-player-nsdr"></div>
    </div>
    <div id="nsdr-timer-display" class="timer-display">00:00</div>
    <div class="session-controls">
      <button id="btn-nsdr-start" class="btn primary" type="button">開始</button>
      <button id="btn-nsdr-stop" class="btn danger" type="button" disabled>終了して記録</button>
    </div>
  </section>

  <!-- 記録画面 -->
  <section id="screen-history" class="screen" hidden>
    <button class="back-link" data-target="home" type="button">← ホームに戻る</button>
    <p class="session-title">記録</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="ring" aria-hidden="true">🔥</div>
        <span id="stat-streak" class="value">0</span>
        <span class="label">連続日数</span>
      </div>
      <div class="stat-card">
        <div class="ring" aria-hidden="true">🌙</div>
        <span id="stat-weekly" class="value">0分</span>
        <span class="label">今週の合計</span>
      </div>
      <div class="stat-card">
        <div class="ring" aria-hidden="true">🌊</div>
        <span id="stat-monthly" class="value">0分</span>
        <span class="label">今月の合計</span>
      </div>
    </div>

    <ul id="history-list" class="history-list"></ul>
    <p id="history-empty" class="empty-state" hidden>まだ記録がありません</p>
  </section>
</div>

<!-- js/config.js: BGM/ナレーション動画IDの設定 -->
<script src="js/config.js"></script>
<!-- js/storage.js: localStorage読み書き -->
<script src="js/storage.js"></script>
<!-- js/stats.js: 統計計算 -->
<script src="js/stats.js"></script>
<!-- js/player.js: YouTube IFrame Player 共通ラッパー -->
<script src="js/player.js"></script>
<!-- js/timer.js: 瞑想タイマー -->
<script src="js/timer.js"></script>
<!-- js/nsdr.js: NSDR再生 -->
<script src="js/nsdr.js"></script>
<!-- js/quotes.js: 自分を大切にする名言のランダム表示 -->
<script src="js/quotes.js"></script>
<!-- js/backgrounds.js: 起動ごとに切り替わる自然写真の背景 -->
<script src="js/backgrounds.js"></script>

<script>
  // ------------------------------------------------------------
  // アプリ全体の初期化・画面遷移・イベント配線
  // （storage.js / stats.js / player.js / timer.js / nsdr.js が
  //   公開する関数・オブジェクトのみを利用する薄いUI制御層）
  // ------------------------------------------------------------

  // --- 背景画像（起動ごとにランダム切り替え） ---
  document.getElementById('bg-layer').style.backgroundImage = `url(${getRandomBackground()})`;

  // --- 画面遷移 ---
  const screens = {
    home: document.getElementById('screen-home'),
    meditation: document.getElementById('screen-meditation'),
    nsdr: document.getElementById('screen-nsdr'),
    history: document.getElementById('screen-history'),
  };

  function showScreen(name) {
    Object.keys(screens).forEach((key) => {
      screens[key].hidden = key !== name;
    });
    if (name === 'history') {
      renderHistory();
    }
    if (name === 'home') {
      updateHomeStreak();
      document.getElementById('quote-text').textContent = getRandomQuote();
    }
  }

  // ホーム画面上部の「連続日数」バッジを更新する
  function updateHomeStreak() {
    const streak = calcStreak(getSessions());
    document.getElementById('home-streak-text').textContent = `連続日数 ${streak}日`;
  }

  document.getElementById('btn-go-meditation').addEventListener('click', () => showScreen('meditation'));
  document.getElementById('btn-go-nsdr').addEventListener('click', () => showScreen('nsdr'));
  document.getElementById('btn-go-history').addEventListener('click', () => showScreen('history'));
  document.querySelectorAll('.back-link').forEach((btn) => {
    btn.addEventListener('click', () => showScreen(btn.dataset.target));
  });

  // --- オフライン通知 ---
  function updateOfflineNotices() {
    const offline = !navigator.onLine;
    document.getElementById('offline-notice-home').hidden = !offline;
    document.getElementById('offline-notice-meditation').hidden = !offline;
    document.getElementById('offline-notice-nsdr').hidden = !offline;
  }
  window.addEventListener('online', updateOfflineNotices);
  window.addEventListener('offline', updateOfflineNotices);
  updateOfflineNotices();

  // YouTube IFrame Player API自体の読み込みに失敗した場合も同様に警告する
  MeditationPlayer.onApiUnavailable(() => {
    document.getElementById('offline-notice-meditation').hidden = false;
    document.getElementById('offline-notice-nsdr').hidden = false;
  });

  // --- 瞑想画面の配線 ---
  // 「動画」モード：BGM動画を画面に表示しながら実施。動画の再生終了と同時に自動終了・記録する。
  // 「タイマー」モード：時間を選んで開始。別のBGM（音声のみ）を流し、指定時間の経過で自動終了・記録する。
  const meditationVideoPlayer = MeditationPlayer.create('yt-player-meditation');
  meditationVideoPlayer.load(CONFIG.MEDITATION_BGM_VIDEO_ID);

  const meditationTimerPlayer = MeditationPlayer.create('yt-player-meditation-timer');
  meditationTimerPlayer.load(CONFIG.MEDITATION_TIMER_BGM_VIDEO_ID);

  const meditationDisplay = document.getElementById('meditation-timer-display');
  const meditationStartBtn = document.getElementById('btn-meditation-start');
  const meditationStopBtn = document.getElementById('btn-meditation-stop');
  const meditationModeVideoBtn = document.getElementById('btn-meditation-mode-video');
  const meditationModeTimerBtn = document.getElementById('btn-meditation-mode-timer');
  const meditationModeVideoSection = document.getElementById('meditation-mode-video');
  const meditationModeTimerSection = document.getElementById('meditation-mode-timer');
  const timerBgmIndicator = document.getElementById('timer-bgm-indicator');
  const durationBtns = Array.from(document.querySelectorAll('.duration-btn'));

  let meditationMode = 'video'; // 'video' | 'timer'
  let selectedTimerMinutes = null;

  function updateMeditationStartEnabled() {
    if (MeditationTimer.isRunning()) return; // 実施中はrunning状態のstateChangeコールバックに任せる
    meditationStartBtn.disabled = meditationMode === 'timer' && selectedTimerMinutes === null;
  }

  function setMeditationMode(mode) {
    if (MeditationTimer.isRunning()) return; // 実施中はモード切替不可
    meditationMode = mode;
    meditationModeVideoBtn.setAttribute('aria-selected', String(mode === 'video'));
    meditationModeTimerBtn.setAttribute('aria-selected', String(mode === 'timer'));
    meditationModeVideoSection.hidden = mode !== 'video';
    meditationModeTimerSection.hidden = mode !== 'timer';
    meditationDisplay.textContent = '00:00';
    updateMeditationStartEnabled();
  }

  meditationModeVideoBtn.addEventListener('click', () => setMeditationMode('video'));
  meditationModeTimerBtn.addEventListener('click', () => setMeditationMode('timer'));

  durationBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      if (MeditationTimer.isRunning()) return;
      selectedTimerMinutes = Number(btn.dataset.min);
      durationBtns.forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
      updateMeditationStartEnabled();
    });
  });

  MeditationTimer.setCallbacks(
    (elapsedSec, targetSec) => {
      // タイマーモード（targetSecあり）は残り時間のカウントダウン、
      // 動画モード（targetSecなし）は経過時間のカウントアップを表示する。
      const displaySec = targetSec !== null ? Math.max(0, targetSec - elapsedSec) : elapsedSec;
      meditationDisplay.textContent = formatElapsed(displaySec);
    },
    (running) => {
      meditationStopBtn.disabled = !running;
      meditationModeVideoBtn.disabled = running;
      meditationModeTimerBtn.disabled = running;
      durationBtns.forEach((b) => {
        b.disabled = running;
      });
      timerBgmIndicator.hidden = !(running && meditationMode === 'timer');
      if (!running) {
        updateMeditationStartEnabled();
      } else {
        meditationStartBtn.disabled = true;
      }
    }
  );

  function finishMeditation(elapsedSec) {
    if (meditationMode === 'video') {
      meditationVideoPlayer.pause();
    } else {
      meditationTimerPlayer.pause();
    }
    meditationDisplay.textContent = '00:00';
    if (elapsedSec > 0) {
      const videoId =
        meditationMode === 'video' ? CONFIG.MEDITATION_BGM_VIDEO_ID : CONFIG.MEDITATION_TIMER_BGM_VIDEO_ID;
      finishMeditationSession(elapsedSec, videoId);
    }
  }

  // 動画モード：動画が最後まで再生されたら自動的に終了・記録する
  meditationVideoPlayer.onEnded(() => {
    if (meditationMode === 'video' && MeditationTimer.isRunning()) {
      const elapsedSec = MeditationTimer.stop();
      finishMeditation(elapsedSec);
    }
  });

  meditationStartBtn.addEventListener('click', () => {
    if (meditationMode === 'video') {
      meditationVideoPlayer.play(); // ユーザー操作の文脈内で呼ぶ（iOSの自動再生制限対策）
      MeditationTimer.start();
    } else {
      if (selectedTimerMinutes === null) return;
      meditationTimerPlayer.play();
      MeditationTimer.start({
        targetSec: selectedTimerMinutes * 60,
        onComplete: (elapsedSec) => finishMeditation(elapsedSec),
      });
    }
  });

  meditationStopBtn.addEventListener('click', () => {
    const elapsedSec = MeditationTimer.stop();
    finishMeditation(elapsedSec);
  });

  setMeditationMode('video');

  // --- NSDR画面の配線 ---
  const nsdrPlayer = MeditationPlayer.create('yt-player-nsdr');
  nsdrPlayer.load(CONFIG.NSDR_NARRATION_VIDEO_ID);

  const nsdrDisplay = document.getElementById('nsdr-timer-display');
  const nsdrStartBtn = document.getElementById('btn-nsdr-start');
  const nsdrStopBtn = document.getElementById('btn-nsdr-stop');

  NsdrTimer.setCallbacks(
    (elapsedSec) => {
      nsdrDisplay.textContent = formatElapsed(elapsedSec);
    },
    (running) => {
      nsdrStartBtn.disabled = running;
      nsdrStopBtn.disabled = !running;
    }
  );

  nsdrStartBtn.addEventListener('click', () => {
    nsdrPlayer.play();
    NsdrTimer.start();
  });

  nsdrStopBtn.addEventListener('click', () => {
    const elapsedSec = NsdrTimer.stop();
    nsdrPlayer.pause();
    nsdrDisplay.textContent = '00:00';
    if (elapsedSec > 0) {
      finishNsdrSession(elapsedSec);
    }
  });

  function formatElapsed(totalSec) {
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const ss = String(s).padStart(2, '0');
    if (h > 0) {
      return `${h}:${String(m).padStart(2, '0')}:${ss}`;
    }
    return `${String(m).padStart(2, '0')}:${ss}`;
  }

  // --- 記録画面の描画 ---
  function renderHistory() {
    const sessions = getSessions();

    document.getElementById('stat-streak').textContent = String(calcStreak(sessions));
    document.getElementById('stat-weekly').textContent = formatDuration(calcWeeklyTotal(sessions));
    document.getElementById('stat-monthly').textContent = formatDuration(calcMonthlyTotal(sessions));

    const list = document.getElementById('history-list');
    const emptyState = document.getElementById('history-empty');
    list.innerHTML = '';

    if (sessions.length === 0) {
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;

    // 新しい記録が上に来るよう、createdAt降順で表示
    const sorted = [...sessions].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));

    sorted.forEach((session) => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const badge = document.createElement('span');
      badge.className = 'type-badge' + (session.type === 'nsdr' ? ' nsdr' : '');
      badge.textContent = session.type === 'nsdr' ? 'NSDR' : '瞑想';

      const date = document.createElement('span');
      date.className = 'date';
      date.textContent = session.date;

      meta.appendChild(badge);
      meta.appendChild(date);

      const duration = document.createElement('span');
      duration.className = 'duration';
      duration.textContent = formatDuration(session.durationSec);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.type = 'button';
      deleteBtn.textContent = '削除';
      deleteBtn.addEventListener('click', () => {
        deleteSession(session.id);
        renderHistory();
      });

      li.appendChild(meta);
      li.appendChild(duration);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });
  }

  // --- Service Worker登録 ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => {
        console.error('Service Worker登録に失敗しました', e);
      });
    });
  }

  // 初期表示
  showScreen('home');
</script>
</body>
</html>
